<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widget Temporarily Unavailable</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .box {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            max-width: 400px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
        h4 {
            margin: 0 0 8px;
            color: #1e293b;
            font-size: 16px;
        }
        p {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="box">
        <h4>Widget Currently Unavailable</h4>
        <p>This widget has been temporarily paused by the provider. Please check back later.</p>
    </div>
</body>
</html>
