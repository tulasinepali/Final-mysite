{% load static %}
<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ widget.title|default:"नेपाली पात्रो २०८३ | Nepali Patro Widget" }}</title>
    <style>
        :root {
            --bg-color: {% if theme == 'dark' %}#0f172a{% else %}#ffffff{% endif %};
            --card-bg: {% if theme == 'dark' %}#1e293b{% else %}#f8fafc{% endif %};
            --cell-bg: {% if theme == 'dark' %}#1e293b{% else %}#ffffff{% endif %};
            --text-color: {% if theme == 'dark' %}#f1f5f9{% else %}#0f172a{% endif %};
            --muted-color: {% if theme == 'dark' %}#94a3b8{% else %}#64748b{% endif %};
            --border-color: {% if theme == 'dark' %}#334155{% else %}#e2e8f0{% endif %};
            --primary-color: #0559b7;
            --primary-light: {% if theme == 'dark' %}#1e3a8a{% else %}#eff6ff{% endif %};
            --holiday-color: #dc2626;
            --holiday-bg: {% if theme == 'dark' %}rgba(220, 38, 38, 0.15){% else %}#fef2f2{% endif %};
            --today-border: #2563eb;
            --today-bg: {% if theme == 'dark' %}#1d4ed8{% else %}#0559b7{% endif %};
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Mukta", sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            font-size: 13px;
            line-height: 1.4;
            user-select: none;
            -webkit-user-select: none;
        }

        .patro-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            max-width: 480px;
            margin: 0 auto;
        }

        /* Header Controls */
        .patro-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .header-title-wrap {
            text-align: left;
            flex-grow: 1;
        }
        .month-year-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary-color);
            line-height: 1.2;
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .ad-range-label {
            font-size: 11px;
            color: var(--muted-color);
            font-weight: 500;
        }
        .nav-btn-group {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .btn-nav {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-nav:hover {
            background: var(--primary-light);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        .btn-today {
            background: var(--primary-color);
            color: #ffffff;
            border-color: var(--primary-color);
        }
        .btn-today:hover {
            background: #033e82;
            color: #ffffff;
        }

        /* Jump Dropdowns */
        .jump-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
        }
        .jump-select {
            flex: 1;
            padding: 5px 8px;
            font-size: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-color);
            cursor: pointer;
            outline: none;
        }
        .jump-select:focus {
            border-color: var(--primary-color);
        }

        /* Weekday Header */
        .weekdays-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 6px;
            text-align: center;
        }
        .weekday-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted-color);
            padding: 4px 0;
            border-radius: 6px;
        }
        .weekday-label.sat {
            color: var(--holiday-color);
        }
        .weekday-label.sun {
            color: #ea580c;
        }

        /* Calendar Days Grid */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 12px;
        }
        .day-cell {
            background: var(--cell-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            min-height: 48px;
            padding: 4px 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
            position: relative;
        }
        .day-cell:hover {
            border-color: var(--primary-color);
            transform: translateY(-1px);
        }
        .day-cell.empty {
            background: transparent;
            border-color: transparent;
            cursor: default;
            visibility: hidden;
        }
        .day-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .bs-day-num {
            font-size: 14px;
            font-weight: 700;
            line-height: 1;
        }
        .ad-day-num {
            font-size: 9px;
            color: var(--muted-color);
            line-height: 1;
        }
        .day-event-dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--holiday-color);
            margin-top: 2px;
            align-self: center;
        }
        .day-event-text {
            font-size: 8.5px;
            color: var(--holiday-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
            margin-top: 2px;
            font-weight: 600;
        }

        /* Highlight States */
        .day-cell.saturday {
            background: var(--holiday-bg);
        }
        .day-cell.saturday .bs-day-num {
            color: var(--holiday-color);
        }
        .day-cell.sunday .bs-day-num {
            color: #c2410c;
        }
        .day-cell.holiday {
            background: var(--holiday-bg);
            border-color: #fca5a5;
        }
        .day-cell.holiday .bs-day-num {
            color: var(--holiday-color);
        }
        .day-cell.today {
            background: var(--primary-light);
            border: 2px solid var(--primary-color);
            box-shadow: 0 0 0 2px rgba(5, 89, 183, 0.15);
        }
        .day-cell.today .bs-day-num {
            color: var(--primary-color);
            font-weight: 900;
        }
        .day-cell.active-selected {
            outline: 2px solid var(--primary-color);
            outline-offset: -1px;
        }

        /* Detail Drawer */
        .selected-detail-card {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .detail-bs {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-color);
        }
        .detail-ad {
            font-size: 11px;
            color: var(--muted-color);
        }
        .detail-event {
            font-size: 11.5px;
            color: var(--holiday-color);
            font-weight: 700;
            background: var(--holiday-bg);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #fecaca;
        }

        /* Monthly Events Accordion / List */
        .month-events-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 12px;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
        }
        .events-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .event-item {
            display: flex;
            align-items: baseline;
            gap: 8px;
            padding: 3px 0;
            border-bottom: 1px dashed var(--border-color);
            font-size: 11.5px;
        }
        .event-item:last-child {
            border-bottom: none;
        }
        .event-gate {
            font-weight: 700;
            color: var(--primary-color);
            min-width: 48px;
            font-variant-numeric: tabular-nums;
        }
        .event-name {
            color: var(--text-color);
            flex-grow: 1;
        }
        .event-badge-h {
            color: var(--holiday-color);
            font-size: 10px;
            font-weight: 700;
        }

        /* Footer Branding */
        .widget-footer {
            margin-top: 10px;
            text-align: center;
            font-size: 11px;
            color: var(--muted-color);
        }
        .widget-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        .widget-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="patro-wrapper">
        
        <!-- Header -->
        <div class="patro-header">
            <div class="header-title-wrap">
                <div class="month-year-title" id="monthYearTitle">
                    <span id="labelBsMonth">--</span> <span id="labelBsYear">----</span>

                <button type="button" class="btn-nav btn-today" id="btnToday" title="आज">आज</button>
                <button type="button" class="btn-nav" id="btnNextMonth" title="पछिल्लो महिना">&#8250;</button>
            </div>
        </div>

        <!-- Jump Dropdowns -->
        <div class="jump-bar">
            <select class="jump-select" id="selectBsYear" title="वर्ष रोज्नुहोस्"></select>
            <select class="jump-select" id="selectBsMonth" title="महिना रोज्नुहोस्"></select>
        </div>

        <!-- Weekdays Header -->
        <div class="weekdays-grid">
            <div class="weekday-label sun" title="आइतबार">आइत</div>
            <div class="weekday-label" title="सोमबार">सोम</div>
            <div class="weekday-label" title="मङ्गलबार">मङ्गल</div>
            <div class="weekday-label" title="बुधबार">बुध</div>
            <div class="weekday-label" title="बिहीबार">बिही</div>
            <div class="weekday-label" title="शुक्रबार">शुक्र</div>
            <div class="weekday-label sat" title="शनिबार (सार्वजनिक बिदा)">शनि</div>
        </div>

        <!-- Days Grid -->
        <div class="days-grid" id="daysGrid"></div>

        <!-- Selected Day Info Card -->
        <div class="selected-detail-card" id="selectedDetailCard">
            <div>
                <div class="detail-bs" id="detailBsText">--</div>
                <div class="detail-ad" id="detailAdText">--</div>
            </div>
            <div id="detailEventBadge" style="display: none;" class="detail-event">--</div>
        </div>

        <!-- Month Festivals Box -->
        <div class="month-events-box" id="monthEventsBox">
            <div class="events-title">
                <span>यस महिनाका चाडपर्व तथा बिदाहरू</span>
                <span id="eventsCountBadge" style="font-weight: normal; font-size: 10px;"></span>
            </div>
            <div id="eventsListContainer"></div>
        </div>

        <!-- Branding Footer -->
        <div class="widget-footer">
            Powered by <a href="{{ widget_settings.branding_url|default:'https://tulasinepali.com.np' }}" target="_blank" rel="noopener">{{ widget_settings.branding_text|default:'Tulasi Nepali' }}</a>
        </div>
    </div>

    <!-- Scripts -->
    <script src="{% static 'js/nepali-calendar.js' %}"></script>

            // 2083 Magh
            "2083-10-01": { title: "माघे संक्रान्ति / माघी", is_holiday: true },
            "2083-10-16": { title: "शहीद दिवस", is_holiday: false },

            "2083-10-28": { title: "सरस्वती पूजा / श्रीपञ्चमी", is_holiday: false },

            // 2083 Falgun
            "2083-11-01": { title: "कुम्भ संक्रान्ति", is_holiday: false },
            "2083-11-07": { title: "राष्ट्रिय प्रजातन्त्र दिवस", is_holiday: true },
            "2083-11-21": { title: "महाशिवरात्रि", is_holiday: true },

            "2083-11-26": { title: "ग्याल्पो ल्होसार", is_holiday: true },

            // 2083 Chaitra
            "2083-12-01": { title: "मीन संक्रान्ति", is_holiday: false },
            "2083-12-08": { title: "फागु पूर्णिमा (होली - पहाड)", is_holiday: true },
            "2083-12-09": { title: "होली पर्व (तराई)", is_holiday: true },
            "2083-12-24": { title: "घोडेजात्रा", is_holiday: false },
            "2083-12-31": { title: "चैते दशैं / चैत्र मसान्त", is_holiday: false }
        };

        var currentViewYear;
        var currentViewMonth;
        var todayBs;

        document.addEventListener("DOMContentLoaded", function () {
            todayBs = NepaliCalendar.getTodayBs();
            
            // Check hash #YYYY-MM
            var hash = window.location.hash.replace('#', '');
            var hashMatch = hash.match(/^(\d{4})-(\d{1,2})$/);
            if (hashMatch) {
                currentViewYear = parseInt(hashMatch[1], 10);
                currentViewMonth = parseInt(hashMatch[2], 10);
            } else {
                currentViewYear = todayBs.bsYear;
                currentViewMonth = todayBs.bsMonth;
            }

            populateDropdowns();
            renderCalendar(currentViewYear, currentViewMonth);

            // Bind Navigation Events
            document.getElementById("btnPrevMonth").addEventListener("click", function () {
                navigateMonth(-1);
            });
            document.getElementById("btnNextMonth").addEventListener("click", function () {
                navigateMonth(1);
            });
            document.getElementById("btnToday").addEventListener("click", function () {
                currentViewYear = todayBs.bsYear;
                currentViewMonth = todayBs.bsMonth;
                updateHash(currentViewYear, currentViewMonth);
                renderCalendar(currentViewYear, currentViewMonth);
                selectDay(todayBs.bsDay);
            });

            document.getElementById("selectBsYear").addEventListener("change", function () {
                currentViewYear = parseInt(this.value, 10);
                updateHash(currentViewYear, currentViewMonth);
                renderCalendar(currentViewYear, currentViewMonth);
            });

            document.getElementById("selectBsMonth").addEventListener("change", function () {
                currentViewMonth = parseInt(this.value, 10);
                updateHash(currentViewYear, currentViewMonth);
                renderCalendar(currentViewYear, currentViewMonth);
            });

            // Track widget embed impression
            try {
                fetch("{% url 'tools:api_track_embed' widget.slug %}", { 
                    method: 'POST', 
                    headers: { 'X-Requested-With': 'XMLHttpRequest' } 
                });
            } catch(e) {}
        });

        function populateDropdowns() {
            var yearSelect = document.getElementById("selectBsYear");
            var monthSelect = document.getElementById("selectBsMonth");
            yearSelect.innerHTML = "";
            monthSelect.innerHTML = "";

            // Populate Years from 2075 to 2095
            for (var y = 2075; y <= 2095; y++) {
                var opt = document.createElement("option");
                opt.value = y;
                opt.textContent = NepaliCalendar.toNepaliDigits(y) + " (" + y + ")";
                if (y === currentViewYear) opt.selected = true;
                yearSelect.appendChild(opt);
            }

            // Populate Months 1 to 12
            NepaliCalendar.BS_MONTHS_NE.forEach(function (mName, idx) {
                var opt = document.createElement("option");
                opt.value = idx + 1;
                opt.textContent = mName + " (" + NepaliCalendar.BS_MONTHS_EN[idx] + ")";
                if (idx + 1 === currentViewMonth) opt.selected = true;
                monthSelect.appendChild(opt);
            });
        }

        function updateHash(year, month) {
            var mStr = month < 10 ? '0' + month : '' + month;
            if (history.replaceState) {
                history.replaceState(null, null, '#' + year + '-' + mStr);
            } else {
                location.hash = '#' + year + '-' + mStr;
            }
        }

        function navigateMonth(direction) {
            currentViewMonth += direction;
            if (currentViewMonth > 12) {
                currentViewMonth = 1;
                currentViewYear++;
            } else if (currentViewMonth < 1) {
                currentViewMonth = 12;
                currentViewYear--;
            }
            updateHash(currentViewYear, currentViewMonth);
            renderCalendar(currentViewYear, currentViewMonth);
        }

        function renderCalendar(year, month) {
            // Update dropdown values
            document.getElementById("selectBsYear").value = year;
            document.getElementById("selectBsMonth").value = month;

            // Labels
            var bsMonthNameNe = NepaliCalendar.BS_MONTHS_NE[month - 1];
            var bsYearNe = NepaliCalendar.toNepaliDigits(year);
            document.getElementById("labelBsMonth").textContent = bsMonthNameNe;
            document.getElementById("labelBsYear").textContent = bsYearNe;

            // Days in this BS month
            var daysInMonth = (NepaliCalendar.bsCalendarData[year] && NepaliCalendar.bsCalendarData[year][month - 1]) || 30;

            // Day 1 AD conversion to find starting weekday
            var firstDayAd = NepaliCalendar.bsToAd(year, month, 1);
            var lastDayAd = NepaliCalendar.bsToAd(year, month, daysInMonth);

            var adMonths = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            var adRangeText = adMonths[firstDayAd.adMonth - 1] + " " + firstDayAd.adDay + " - " + 
                              adMonths[lastDayAd.adMonth - 1] + " " + lastDayAd.adDay + ", " + lastDayAd.adYear;
            document.getElementById("labelAdRange").textContent = adRangeText;

            var startWeekday = firstDayAd.dayOfWeek; // 0 = Sunday, 6 = Saturday

            var grid = document.getElementById("daysGrid");
            grid.innerHTML = "";

            // Empty cells before 1st day
            for (var i = 0; i < startWeekday; i++) {
                var emptyCell = document.createElement("div");
                emptyCell.className = "day-cell empty";
                grid.appendChild(emptyCell);
            }

            var monthEventsList = [];

            // Render day cells
            for (var d = 1; d <= daysInMonth; d++) {
                var cell = document.createElement("div");
                cell.className = "day-cell";
                cell.id = "day-cell-" + d;

                var currentAd = NepaliCalendar.bsToAd(year, month, d);
                var weekday = currentAd.dayOfWeek;

                if (weekday === 6) {
                    cell.classList.add("saturday");
                } else if (weekday === 0) {
                    cell.classList.add("sunday");
                }

                // Check today
                var isToday = (year === todayBs.bsYear && month === todayBs.bsMonth && d === todayBs.bsDay);
                if (isToday) {
                    cell.classList.add("today");
                }

                // Check event/holiday
                var dateKey = year + "-" + (month < 10 ? "0" + month : month) + "-" + (d < 10 ? "0" + d : d);
                var eventInfo = NEPALI_EVENTS[dateKey];
                
                // Generic Sankranti for day 1
                if (!eventInfo && d === 1) {
                    eventInfo = { title: bsMonthNameNe + " संक्रान्ति", is_holiday: false };
                }

                if (eventInfo) {
                    if (eventInfo.is_holiday) {
                        cell.classList.add("holiday");
                    }
                    monthEventsList.push({
                        day: d,
                        weekday: NepaliCalendar.DAYS_NE[weekday],
                        title: eventInfo.title,
                        is_holiday: eventInfo.is_holiday
                    });
                }

                var topRow = document.createElement("div");
                topRow.className = "day-top-row";

                var bsNumSpan = document.createElement("span");
                bsNumSpan.className = "bs-day-num";
                bsNumSpan.textContent = NepaliCalendar.toNepaliDigits(d);
                topRow.appendChild(bsNumSpan);

                var adNumSpan = document.createElement("span");
                adNumSpan.className = "ad-day-num";
                adNumSpan.textContent = currentAd.adDay;
                topRow.appendChild(adNumSpan);

                cell.appendChild(topRow);

                if (eventInfo) {
                    var eventText = document.createElement("div");
                    eventText.className = "day-event-text";
                    eventText.textContent = eventInfo.title;
                    cell.appendChild(eventText);
                }

                // Click event on day
                (function (dayNum, adObj, evt) {
                    cell.addEventListener("click", function () {
                        selectDay(dayNum, adObj, evt);
                    });
                })(d, currentAd, eventInfo);

                grid.appendChild(cell);
            }

            // Update Month Events Box
            renderEventsBox(monthEventsList, bsMonthNameNe);

            // Default select today if in this month, else day 1
            if (year === todayBs.bsYear && month === todayBs.bsMonth) {
                selectDay(todayBs.bsDay);
            } else {
                selectDay(1);
            }
        }

        function selectDay(dayNum, adObj, eventInfo) {
            // Remove previous active state
            var prevSelected = document.querySelector(".day-cell.active-selected");
            if (prevSelected) prevSelected.classList.remove("active-selected");

            var cell = document.getElementById("day-cell-" + dayNum);
            if (cell) cell.classList.add("active-selected");

            if (!adObj) {
                adObj = NepaliCalendar.bsToAd(currentViewYear, currentViewMonth, dayNum);
            }
            if (!eventInfo) {
                var mKey = (currentViewMonth < 10 ? "0" + currentViewMonth : currentViewMonth);
                var dKey = (dayNum < 10 ? "0" + dayNum : dayNum);
                eventInfo = NEPALI_EVENTS[currentViewYear + "-" + mKey + "-" + dKey];
                if (!eventInfo && dayNum === 1) {
                    eventInfo = { title: NepaliCalendar.BS_MONTHS_NE[currentViewMonth - 1] + " संक्रान्ति", is_holiday: false };
                }
            }

            var bsMonthName = NepaliCalendar.BS_MONTHS_NE[currentViewMonth - 1];
            var bsDayNe = NepaliCalendar.toNepaliDigits(dayNum);
            var bsYearNe = NepaliCalendar.toNepaliDigits(currentViewYear);
            var weekdayNe = NepaliCalendar.DAYS_NE[adObj.dayOfWeek];

            var adMonths = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            var weekdayEn = NepaliCalendar.DAYS_EN[adObj.dayOfWeek];
            var adText = weekdayEn + ", " + adMonths[adObj.adMonth - 1] + " " + adObj.adDay + ", " + adObj.adYear;

            document.getElementById("detailBsText").textContent = bsMonthName + " " + bsDayNe + ", " + bsYearNe + " (" + weekdayNe + ")";
            document.getElementById("detailAdText").textContent = adText;

            var badge = document.getElementById("detailEventBadge");
            if (eventInfo) {
                badge.textContent = eventInfo.title + (eventInfo.is_holiday ? " (बिदा)" : "");
                badge.style.display = "inline-block";
            } else {
                badge.style.display = "none";
            }
        }

        function renderEventsBox(eventsList, monthName) {
            var container = document.getElementById("eventsListContainer");
            var badge = document.getElementById("eventsCountBadge");
            container.innerHTML = "";

            if (!eventsList || eventsList.length === 0) {
                badge.textContent = "(० वटा)";
                container.innerHTML = '<div style="color: var(--muted-color); font-size: 11.5px; padding: 4px 0;">यस महिनामा कुनै विशेष चाडपर्व वा बिदा छैन।</div>';
                return;
            }

            badge.textContent = "(" + NepaliCalendar.toNepaliDigits(eventsList.length) + " वटा)";

            eventsList.forEach(function (ev) {
                var item = document.createElement("div");
                item.className = "event-item";

                var gateSpan = document.createElement("span");
                gateSpan.className = "event-gate";
                gateSpan.textContent = NepaliCalendar.toNepaliDigits(ev.day) + " गते";

                var titleSpan = document.createElement("span");
                titleSpan.className = "event-name";
                titleSpan.textContent = ev.title;

                item.appendChild(gateSpan);
                item.appendChild(titleSpan);

                if (ev.is_holiday) {
                    var hBadge = document.createElement("span");
                    hBadge.className = "event-badge-h";
                    hBadge.textContent = "● सार्वजनिक बिदा";
                    item.appendChild(hBadge);
                }

                container.appendChild(item);
            });
        }
    </script>
</body>
</html>
