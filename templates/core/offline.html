<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अफलाइन हुनुहुन्छ (Offline) - Tulasi Nepali</title>
    <link rel="icon" href="/static/images/pwa/icon-192x192.png" type="image/png">
    <meta name="theme-color" content="#0559b7">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Mukta", sans-serif;
            background: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        .offline-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 36px 24px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 1px solid #e2e8f0;
        }
        .offline-icon-wrap {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: rgba(5, 89, 183, 0.08);
            color: #0559b7;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .offline-icon-wrap svg {
            width: 44px;
            height: 44px;
            fill: currentColor;
        }
        h1 {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 24px;
        }
        .btn-retry {
            background: #0559b7;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(5, 89, 183, 0.3);
            transition: all 0.2s ease;
            display: inline-block;
            text-decoration: none;
        }
        .btn-retry:hover {
            background: #04448c;
            transform: translateY(-2px);
        }
        .offline-hint {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon-wrap">
            <svg viewBox="0 0 24 24">
                <path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.27 0 6.32 1.15 8.74 3.07L12 19.34 3.26 10.57C5.68 8.65 8.73 7.5 12 7.5zM2.93 2.93L1.51 4.34l2.1 2.1C1.86 7.42.34 8.71 0 8.98L12 21l3.54-3.54 4.12 4.12 1.41-1.41L2.93 2.93z"/>
            </svg>
        </div>
        <h1>इन्टरनेट कनेक्सन छैन</h1>
        <p>तपाईं हाल अफलाइन हुनुहुन्छ। कृपया आफ्नो वाइफाइ (Wi-Fi) वा मोबाइल डाटा जाँच गर्नुहोस्।</p>
        <button class="btn-retry" onclick="window.location.reload();">
            पुन: प्रयास गर्नुहोस् (Retry)
        </button>
        <div class="offline-hint">
            Tulasi Nepali PWA • अफलाइन मोड
        </div>
    </div>
</body>
</html>
